[pytest]
# rootdir is monitoring-service/, so "from services.monitoring_manager import ..."
# resolves the same way it does when app.py runs. Without this, imports fail
# because the service uses top-level package names rather than a src layout.
pythonpath = .

testpaths = tests

# Quiet, readable output; -ra shows a summary of anything non-passing.
addopts = -ra --strict-markers

markers =
    slow: tests that intentionally wait on real time (deselect with '-m "not slow"')
