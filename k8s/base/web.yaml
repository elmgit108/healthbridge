apiVersion: apps/v1
kind: Deployment
metadata:
  name: hb-web-deployment
  namespace: healthbridge
  labels:
    app: hb-web
    tier: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hb-web
  template:
    metadata:
      labels:
        app: hb-web
        tier: frontend
    spec:
      imagePullSecrets:
        - name: ghcr
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16M
      containers:
      - name: hb-web-container
        image: ghcr.io/elmgit108/healthbridge-web:v0.1.1
        ports:
          - containerPort: 8081
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8081
        # Sized for lalita27, which shares 16 GB with the observability stack.
        # Nothing here pins the pod to that node — it lands there because
        # lalita12 carries a NoSchedule taint.
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            memory: 64Mi
        securityContext:
          runAsNonRoot: true
          runAsUser: 101
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
          - name: tmp
            mountPath: /tmp
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: healthbridge
  labels:
    app: hb-web
    tier: frontend
spec:
  # private internal IP
  type: ClusterIP
  selector:
      app: hb-web
  ports:
    - name: http
      port: 8081 # hb gataway calls
      targetPort: 8081 # nginx listens
      protocol: TCP