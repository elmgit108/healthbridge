services:
  # --- OpenTelemetry collector / trace UI ---
  # Jaeger all-in-one: receives OTLP gRPC on 4317, serves UI on 16686
  jaeger:
    image: jaegertracing/all-in-one:1.55
    container_name: healthbridge-jaeger
    ports:
      - "16686:16686"  # Jaeger UI — open http://localhost:16686
      - "4317:4317"    # OTLP gRPC receiver
      - "4318:4318"    # OTLP HTTP receiver
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    restart: unless-stopped

  hl7-service:
    build: ./hl7-service
    container_name: healthbridge-hl7
    ports:
      - "5001:5001"
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - OTEL_SERVICE_NAME=hl7-service
    depends_on:
      - jaeger
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  monitoring-service:
    build: ./monitoring-service
    container_name: healthbridge-monitoring
    ports:
      - "5002:5002"
    environment:
      - HL7_SERVICE_URL=http://hl7-service:5001
      - GATEWAY_URL=http://gateway:8080
      - AWS_REGION=ca-central-1
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - OTEL_SERVICE_NAME=monitoring-service
    depends_on:
      - hl7-service
      - jaeger
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5002/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  gateway:
    build: ./gateway
    container_name: healthbridge-gateway
    ports:
      - "8080:8080"
    environment:
      - HL7_SERVICE_URL=http://hl7-service:5001
      - MONITORING_SERVICE_URL=http://monitoring-service:5002
      - OTEL_EXPORTER_OTLP_ENDPOINT=jaeger:4317
      - OTEL_SERVICE_NAME=gateway
    depends_on:
      - hl7-service
      - monitoring-service
      - jaeger
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
