# Serves the three demo pages. Nothing else — the API lives behind the gateway,
# and the browser reaches both through the gateway, so this never proxies.
#
# Port 8081 rather than 80 so the container needs no privileged port and can run
# as a non-root user unchanged.

server {
    listen 8081;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Its own liveness endpoint, so Kubernetes probes do not depend on a page.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # The pages change on every deploy and are tiny. Caching them only creates
    # "why am I seeing the old page?" confusion during a demo.
    location / {
        add_header Cache-Control "no-store";
        try_files $uri $uri/ =404;
    }
}
